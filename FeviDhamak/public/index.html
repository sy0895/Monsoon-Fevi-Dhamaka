<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monsoon Fevi-Dhamaka — Dealer Lookup</title>
<style>
  :root{
    --gold:#e8c26b;
    --gold-bright:#ffd76a;
    --platinum:#dfe6ee;
    --silver:#c7ccd1;
    --bg-deep:#0b0f2b;
    --bg-mid:#171236;
    --card:#1b1547;
    --accent:#ff5d73;
    --accent2:#5ad1ff;
    --text:#f4f1ff;
    --muted:#a9a3d6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at 20% 10%, #2a1c6b 0%, var(--bg-deep) 45%, #05061a 100%);
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    overflow-x:hidden;
    padding-bottom:40px;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,.5) 0, transparent 50%),
      radial-gradient(2px 2px at 80% 30%, rgba(255,255,255,.4) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 40% 70%, rgba(255,255,255,.35) 0, transparent 50%),
      radial-gradient(2px 2px at 65% 85%, rgba(255,255,255,.4) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 90% 65%, rgba(255,255,255,.3) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 25% 55%, rgba(255,255,255,.3) 0, transparent 50%);
    pointer-events:none;
    z-index:0;
  }
  .wrap{
    position:relative;
    z-index:2;
    width:100%;
    max-width:720px;
    padding:20px 20px 10px;
    text-align:center;
  }
  .header-row{
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
    margin-bottom:8px;
  }
  .logo-badge{
    display:inline-block;
    background:rgba(255,255,255,.94);
    border-radius:12px;
    padding:6px 12px 5px;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    line-height:0;
  }
  .logo-badge img{
    display:block;
    width:96px;
    height:auto;
  }
  body{
    text-transform:uppercase;
  }
  @media (max-width:600px){
    .logo-badge{
      padding:5px 9px 4px;
    }
    .logo-badge img{ width:68px; }
  }
  .marquee{
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--accent2);
    font-weight:600;
    margin-bottom:6px;
  }
  h1{
    font-size:clamp(28px,6vw,46px);
    margin:0 0 6px;
    background:linear-gradient(90deg, var(--gold-bright), #fff, var(--gold-bright));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 30px rgba(255,215,110,.25);
    letter-spacing:1px;
  }
  .subtitle{
    color:var(--muted);
    font-size:15px;
    margin-bottom:28px;
  }
  .tickets-row{
    display:flex;
    justify-content:center;
    gap:6px;
    font-size:22px;
    margin-bottom:18px;
    opacity:.85;
  }
  .machine{
    background:linear-gradient(160deg, var(--card), #241b5e 60%, #150f3a);
    border:1px solid rgba(255,215,110,.35);
    border-radius:22px;
    padding:28px 24px 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 0 40px rgba(255,215,110,.05);
    position:relative;
  }
  .machine::before, .machine::after{
    content:"";
    position:absolute;
    width:10px;height:10px;
    border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 12px var(--gold-bright);
    top:14px;
  }
  .machine::before{left:16px;}
  .machine::after{right:16px;}
  label{
    display:block;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .input-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  input#dealerCode{
    flex:1 1 240px;
    padding:16px 18px;
    font-size:20px;
    letter-spacing:2px;
    text-transform:uppercase;
    border-radius:14px;
    border:2px solid rgba(255,215,110,.4);
    background:#0f0a2c;
    color:#fff;
    outline:none;
    text-align:center;
    font-weight:700;
  }
  input#dealerCode:focus{
    border-color:var(--gold-bright);
    box-shadow:0 0 0 4px rgba(255,215,110,.15);
  }
  button#drawBtn{
    flex:0 0 auto;
    padding:16px 26px;
    font-size:17px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    border:none;
    border-radius:14px;
    cursor:pointer;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:#241a02;
    box-shadow:0 8px 22px rgba(255,215,110,.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button#drawBtn:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(255,215,110,.45); }
  button#drawBtn:active{ transform:translateY(0px) scale(.98); }
  button#drawBtn:disabled{ opacity:.6; cursor:wait; transform:none; }

  .hint{
    margin-top:12px;
    font-size:12px;
    color:var(--muted);
  }

  .result-area{
    margin-top:26px;
    min-height:10px;
  }

  .spinner-card{
    padding:30px;
    font-size:18px;
    color:var(--gold-bright);
    letter-spacing:3px;
    font-weight:700;
  }
  .spinner-dots span{
    display:inline-block;
    animation: bounce 1s infinite;
    margin:0 2px;
  }
  .spinner-dots span:nth-child(2){animation-delay:.15s;}
  .spinner-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{
    0%,80%,100%{ transform:translateY(0); opacity:.5;}
    40%{ transform:translateY(-8px); opacity:1;}
  }

  .ticket{
    position:relative;
    margin-top:18px;
    background:linear-gradient(160deg,#fffaf0, #fff);
    color:#241a3d;
    border-radius:18px;
    padding:26px 22px 22px;
    text-align:left;
    box-shadow:0 25px 60px rgba(0,0,0,.5);
    animation: popin .45s cubic-bezier(.2,1.4,.4,1) both;
    overflow:hidden;
  }
  @keyframes popin{
    0%{ transform:scale(.85) translateY(14px); opacity:0; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    width:26px; height:26px;
    background:var(--bg-deep);
    border-radius:50%;
    top:50%;
    transform:translateY(-50%);
  }
  .ticket::before{ left:-13px; }
  .ticket::after{ right:-13px; }
  .ticket-perf{
    position:absolute;
    left:0; right:0;
    border-top:2px dashed rgba(36,26,61,.25);
  }
  .tier-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-weight:800;
    font-size:15px;
    padding:8px 16px;
    border-radius:999px;
    letter-spacing:1px;
    text-transform:uppercase;
    box-shadow:0 6px 16px rgba(0,0,0,.25);
  }
  .tier-Platinum{ background:linear-gradient(120deg,#e9edf3,#b9c3cf 45%,#eef2f6); color:#2a3542; }
  .tier-Gold{ background:linear-gradient(120deg,#ffe8a3,#e8b13d 45%,#fff2c9); color:#4a3200; }
  .tier-Silver{ background:linear-gradient(120deg,#f1f2f4,#c3c8cd 45%,#f6f7f8); color:#33383d; }
  .tier-None{ background:#e7e3f5; color:#544a86; }

  .dealer-name{
    font-size:24px;
    font-weight:800;
    margin:14px 0 2px;
    color:#1c1440;
  }
  .dealer-code{
    font-size:13px;
    letter-spacing:2px;
    color:#8a83b0;
    font-weight:700;
    text-transform:uppercase;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:18px;
  }
  .stat{
    background:#f6f3ff;
    border-radius:12px;
    padding:12px 14px;
  }
  .stat .k{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#8a83b0;
    font-weight:700;
    margin-bottom:4px;
  }
  .stat .v{
    font-size:17px;
    font-weight:800;
    color:#241a3d;
  }
  .ticket-count{
    margin-top:18px;
    text-align:center;
    padding:16px;
    border-radius:14px;
    background:linear-gradient(135deg,#241a3d,#3c2a70);
    color:#fff;
  }
  .ticket-count .num{
    font-size:44px;
    font-weight:900;
    color:var(--gold-bright);
    text-shadow:0 0 20px rgba(255,215,110,.5);
    line-height:1;
  }
  .ticket-count .lbl{
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#cfc9ec;
    margin-top:4px;
  }
  .band-note{
    margin-top:14px;
    font-size:12.5px;
    color:#6b6390;
    background:#f6f3ff;
    border-radius:10px;
    padding:10px 12px;
  }
  .band-note b{ color:#3d3170; }

  .data-asof{
    font-size:12px;
    letter-spacing:1px;
    color:var(--muted);
    margin:-4px 0 18px;
    opacity:.85;
  }

  .gifts-toggle{
    margin-top:16px;
  }
  .gifts-toggle summary{
    cursor:pointer;
    list-style:none;
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:800;
    font-size:13.5px;
    color:#3d3170;
    background:#f0ecff;
    border-radius:10px;
    padding:10px 14px;
    user-select:none;
  }
  .gifts-toggle summary::-webkit-details-marker{ display:none; }
  .gifts-toggle summary .chev{
    transition:transform .2s ease;
    font-size:11px;
  }
  .gifts-toggle[open] summary .chev{ transform:rotate(90deg); }
  .gifts-toggle .gifts-body{
    margin-top:10px;
    padding:4px 2px 2px;
  }
  .gift-tier-block{
    margin-bottom:14px;
    border-radius:12px;
    padding:12px 14px;
    background:#f6f3ff;
  }
  .gift-tier-block.is-current{
    background:#fff6dc;
    border:1.5px solid #e8c26b;
  }
  .gift-tier-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-weight:800;
    font-size:13px;
    letter-spacing:.5px;
    margin-bottom:8px;
    color:#241a3d;
  }
  .gift-tier-heading .you-flag{
    font-size:10.5px;
    font-weight:800;
    letter-spacing:.5px;
    background:#e8c26b;
    color:#3a2900;
    padding:3px 8px;
    border-radius:999px;
  }
  .gift-list{
    margin:0;
    padding:0;
    list-style:none;
    font-size:12.5px;
    color:#453b6b;
  }
  .gift-list li{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:4px 0;
    border-bottom:1px dashed rgba(69,59,107,.15);
  }
  .gift-list li:last-child{ border-bottom:none; }
  .gift-list .gname{ text-align:left; }
  .gift-list .gmeta{ text-align:right; white-space:nowrap; color:#241a3d; font-weight:700; }

  .not-found, .no-name{
    margin-top:18px;
    padding:22px;
    border-radius:16px;
    background:rgba(255,93,115,.12);
    border:1px solid rgba(255,93,115,.4);
    color:#ffd7dd;
    text-align:left;
    font-size:14.5px;
    line-height:1.5;
  }
  .not-found b{ color:#ff9ba7; }
  .no-name-flag{
    display:inline-block;
    margin-top:10px;
    font-size:12px;
    padding:6px 10px;
    border-radius:8px;
    background:rgba(255,255,255,.12);
    color:#e3dcff;
  }

  footer{
    position:relative;
    z-index:2;
    max-width:720px;
    margin-top:34px;
    padding:18px 22px;
    font-size:12px;
    line-height:1.6;
    color:var(--muted);
    border-top:1px solid rgba(255,255,255,.08);
  }
  footer b{ color:#cfc9ec; }
  details summary{
    cursor:pointer;
    color:var(--accent2);
    font-weight:600;
    margin-bottom:8px;
  }
  table.bands{
    width:100%;
    border-collapse:collapse;
    margin-top:8px;
    font-size:11.5px;
  }
  table.bands th, table.bands td{
    border:1px solid rgba(255,255,255,.12);
    padding:5px 7px;
    text-align:center;
  }
  table.bands th{ color:var(--gold-bright); }

  #confetti-canvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
  }

  @media (max-width:480px){
    .grid{ grid-template-columns:1fr; }
  }
</style>
</head>

        { name: 'Samsung 43" UHD Smart TV', cost: 33990, count: 3 },
        { name: 'IFB 30L Microwave', cost: 15690, count: 6 },
      ],
      Gold: [
        { name: 'LG 7 Kg Front Load WM', cost: 27490, count: 1 },
        { name: 'Canon Pixma Printer', cost: 13749, count: 3 },
        { name: 'boAt Aavante 2.1 1650 Home Theatre', cost: 5999, count: 12 },
        { name: 'Philips Air Fryer', cost: 4746, count: 16 },
      ],
      Silver: [
        { name: 'Xiaomi 32" TV', cost: 13999, count: 1 },
        { name: 'Bajaj Rex Dlx Ninja Mixer Grinder', cost: 3499, count: 15 },
        { name: 'Noise Pulse 4 Max', cost: 2499, count: 25 },
        { name: 'boAt Stone 352 Pro', cost: 1799, count: 30 },
        { name: 'Safari Trolley Bag', cost: 1499, count: 40 },
      ],
    },
  };

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderSpinner(){
    area.innerHTML = `<div class="spinner-card">Spinning the drum
      <span class="spinner-dots"><span>.</span><span>.</span><span>.</span></span></div>`;
  }

  function renderNotFound(code){
    area.innerHTML = `<div class="not-found">
      <b>No ticket record found.</b> Dealer code <b>${escapeHtml(code)}</b> does not have a ticket yet.
      Please double-check the code, or you may not have made an eligible purchase yet during the
      scheme window (Aug'26–Sep'26).
    </div>`;
  }

  function renderError(){
    area.innerHTML = `<div class="not-found">
      <b>Couldn't reach the lookup right now.</b> Please check your internet connection and try again.
    </div>`;
  }

  function tierClass(tierName){
    if (tierName === 'Platinum') return 'tier-Platinum';
    if (tierName === 'Gold') return 'tier-Gold';
    if (tierName === 'Silver') return 'tier-Silver';
    return 'tier-None';
  }

  function formatRupees(n){
    return 'Rs ' + n.toLocaleString('en-IN');
  }

  function renderGiftsBlock(zoneFull, currentTier){
    const catalogue = GIFTS_BY_ZONE[zoneFull];
    if (!catalogue) return '';

    const tierOrder = ['Platinum', 'Gold', 'Silver'];
    const blocks = tierOrder.map(tier => {
      const items = catalogue[tier] || [];
      const isCurrent = tier === currentTier;
      const rows = items.map(g => `
        <li>
          <span class="gname">${escapeHtml(g.name)}</span>
          <span class="gmeta">${formatRupees(g.cost)} × ${g.count}</span>
        </li>
      `).join('');
      return `
        <div class="gift-tier-block${isCurrent ? ' is-current' : ''}">
          <div class="gift-tier-heading">
            <span>${tier === 'Platinum' ? '🥇' : tier === 'Gold' ? '🥈' : '🥉'} ${tier}</span>
            ${isCurrent ? '<span class="you-flag">YOUR TIER</span>' : ''}
          </div>
          <ul class="gift-list">${rows}</ul>
        </div>
      `;
    }).join('');

    return `
      <details class="gifts-toggle">
        <summary><span class="chev">▶</span> See prizes for the ${escapeHtml(ZONE_SHORT_MAP[zoneFull] || zoneFull)} zone, every tier</summary>
        <div class="gifts-body">${blocks}</div>
      </details>
    `;
  }

  const ZONE_SHORT_MAP = {
    'CPASF EAST': 'East', 'CPASF WEST': 'West', 'CPASF NORTH': 'North', 'CPASF SOUTH': 'South'
  };

  function renderResult(rec){
    const tierName = rec.tier; // null | 'Silver' | 'Gold' | 'Platinum'

    const nameHtml = rec.name
      ? escapeHtml(rec.name)
      : `<span style="color:#b7286a;">Name not on record</span>`;

    let bandLine = '';
    if (tierName){
      bandLine = `You are in <b>${tierName}</b> tier (${escapeHtml(rec.bandLabel)} tickets for the ${escapeHtml(rec.zoneShort)} zone).`;
    } else {
      bandLine = `No tier yet — the ${escapeHtml(rec.zoneShort)} zone's Silver tier starts at 1 ticket. Keep buying eligible products to earn more tickets!`;
    }

    area.innerHTML = `
      <div class="ticket">
        <div class="dealer-code">Dealer ${escapeHtml(rec.code)}</div>
        <div class="dealer-name">${nameHtml}</div>
        <span class="tier-badge ${tierClass(tierName)}">${tierName ? '🏆 ' + tierName : '— No tier yet'}</span>

        <div class="grid">
          <div class="stat"><div class="k">Cluster</div><div class="v">${escapeHtml(rec.cluster)}</div></div>
          <div class="stat"><div class="k">Zone</div><div class="v">${escapeHtml(rec.zoneFull)}</div></div>
        </div>

        <div class="ticket-count">
          <div class="num">${rec.tickets.toLocaleString('en-IN')}</div>
          <div class="lbl">Lottery tickets held</div>
        </div>

        <div class="ticket-perf" style="position:relative; margin-top:18px;"></div>
        <div class="band-note">${bandLine}</div>

        ${renderGiftsBlock(rec.zoneFull, tierName)}
      </div>
    `;

    if (tierName){ launchConfetti(tierName); }
  }

  async function doDraw(){
    const raw = input.value.trim();
    if (!raw){
      area.innerHTML = `<div class="not-found">Enter a dealer code first.</div>`;
      return;
    }
    const code = raw.toUpperCase();
    btn.disabled = true;
    renderSpinner();
    const started = Date.now();
    try{
      const res = await fetch(`${LOOKUP_URL}?code=${encodeURIComponent(code)}`);
      const data = await res.json();
      // keep the spin feeling deliberate even on a fast network
      const elapsed = Date.now() - started;
      const wait = Math.max(0, 700 - elapsed) + Math.random()*400;
      setTimeout(() => {
        btn.disabled = false;
        if (!data || !data.found){ renderNotFound(code); return; }
        renderResult(data);
      }, wait);
    } catch (err){
      btn.disabled = false;
      renderError();
    }
  }

  btn.addEventListener('click', doDraw);
  input.addEventListener('keydown', e => { if (e.key === 'Enter'){ doDraw(); } });

  // ---- lightweight confetti ----
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  const colorSets = {
    Platinum: ['#dfe6ee','#ffffff','#c7ccd1','#ffd76a'],
    Gold: ['#ffd76a','#e8c26b','#fff2c9','#ffffff'],
    Silver: ['#f1f2f4','#c7ccd1','#ffffff','#dfe6ee'],
  };
  let particles = [];
  let rafId = null;

  function launchConfetti(tier){
    const colors = colorSets[tier] || colorSets.Gold;
    const count = tier === 'Platinum' ? 160 : tier === 'Gold' ? 120 : 80;
    for (let i=0;i<count;i++){
      particles.push({
        x: canvas.width/2 + (Math.random()-0.5)*200,
        y: -20 - Math.random()*100,
        vx: (Math.random()-0.5)*6,
        vy: 2 + Math.random()*4,
        size: 4 + Math.random()*6,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*Math.PI,
        vr: (Math.random()-0.5)*0.3,
        life: 0,
        maxLife: 140 + Math.random()*60
      });
    }
    if (!rafId){ animate(); }
  }

  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.vr; p.life++;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      ctx.restore();
    });
    particles = particles.filter(p => p.life < p.maxLife && p.y < canvas.height + 40);
    if (particles.length > 0){
      rafId = requestAnimationFrame(animate);
    } else {
      rafId = null;
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }

  input.focus();
})();
</script>

</body>
</html>
